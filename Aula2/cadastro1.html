<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>

<body>
    <div style="background-color: rgb(32, 182, 57);">
        <header style="color: rgb(253, 253, 253);">
            <br>
            <h1> Formulário de Cadastros</h1>
        </header>
        <hr>
    </div>
    <form>
        <table width="400">
            <tr>
                <td><br><label for="nome"><b>Seu nome:</b></label></td>
                <td><br><input style="padding: 2%; width: 5.62cm;" type="text" id="nome" name="nome"
                        placeholder="Digite seu nome completo"></td>
            </tr>
            <tr>
                <td><br><label for="restricao"><b>Possui Alguma restrição alimentar?</b></label></td>
                <td><br><textarea style="padding: 2%; width: 5.69cm;" id="restricao" name="restricao"
                        placeholder="Escreva aqui"></textarea> </td>
            </tr>
            <tr>
                <td><br><label for="curso"><b>Selecione o curso:</b></label></td>
                <td><br><select style="padding: 2%; width: 6cm;" id="curso" name="curso">
                        <option value="0">---Selecione---</option>
                        <option value="1">Sistemas</option>
                        <option value="2">Agronomia</option>
                        <option value="3">Outros</option>
                    </select></td>
            </tr>
            <tr>
                <td><br><label for="turma"><b>Selecione a turma:</b></label></td>
                <td><br><select style="padding: 2%; width: 6cm;" id="turma" name="turma">
                        <option value="0">---Selecione---</option>
                        <option value="1">1° Período</option>
                        <option value="2">2° Período</option>
                        <option value="3">3° Período</option>
                    </select></td>
            </tr>
            <tr>
                <td><br><label for="email"><b>Email:</b></label></td>
                <td><br><input style="padding: 2%;  width: 4.5cm;" type="text" id="email" name="email"
                        placeholder="ciclano@gmail.com"></td>
            </tr>
            <tr>
                <td><br><label for="senha"><b>Senha:</b></label></td>
                <td><br><input style="padding: 2%;width: 4.5cm;" type="password" id="senha" name="senha"
                        placeholder="********"></td>
            </tr>
            <tr>
                <td><br><label for="cSenha"><b>Confirmar Senha:</b></label></td>
                <td><br><input style="padding: 2%; width: 4.5cm;" type="password" id="cSenha" name="cSenha"
                        placeholder="********"></td>
            </tr>
            <tr>
                <td><br><label for="perfil"><b>Perfil:</b></label>
                </td>
                <td><br><input style="padding: 2%;" type="checkbox" id="professor" name="perfil" value="professor">
                    Professor
                    <input style="padding: 2%;" type="checkbox" id="aluno" name="perfil" value="aluno"> Aluno
                    <button
                        style="border: 4cap; padding: 4%; width: 2.2cm;background-color:rgb(32, 182, 57);color: rgb(255, 255, 255);"
                        type="submit"> Enviar
                    </button>

                </td>
            </tr>
        </table>
    </form>
</body>

</html>
