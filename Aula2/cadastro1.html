<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <table >
        <tr>
            <td>Seu nome:</td>
            <td><input placeholder="Digite seu nome" type="text"> <br></td>
        </tr>
        <tr>
            <td>Possui alguma restrição alimentar?</td>
            <td><textarea placeholder="Escreva aqui" ></textarea> </td>
        </tr>
    <tr>
            <td>Selecione o curso:</td>
            <td><select>
                <option value="0">---Selecione---</option>
                <option value="1">Sistemas</option>
                <option value="2">Agronomia</option>
                <option value="3">Outros</option> 
            </select></td>
        </tr>
    <tr>
            <td>Selecione a turma:</td>
            <td><select>
                <option value="0">---Selecione---</option>
                <option value="1">Sistemas</option>
                <option value="2">Agronomia</option>
                <option value="3">Outros</option> 
            </select></td>
        </tr>
    <tr>
            <td>Selecione a turma:</td>
            <td><input placeholder="ciclano@gmail.com" type="text"></td>
        </tr>
    <tr>
            <td>Senha:</td>
            <td><input placeholder="********" type="password"></td>
        </tr>
    <tr>
            <td>Confirmar senha:</td>
            <td><input placeholder="********" type="password"></td>
        </tr>
    <tr>
            <td>Perfil:</td>
            <td><input type="checkbox" name="perfil"
                value="professor" > Professor
                <input type="checkbox" name="perfil"
                value="aluno" > Aluno</td>
                <td><button type="submit"> Enviar</button></td>
        </tr>
    </table>
</body>
</html>
