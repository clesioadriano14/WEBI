<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo</title>
</head>

<body>
    <div style="background-color: rgb(32, 182, 57);">

    <br>
    <div style="background-color: rgb(217, 221, 218); padding: 20px;">

                <td>

                </td>

        </table>
    </div>

                </td>
                <td>

                    <br><br><button
                        style="border: 4cap; width: 3.7cm; padding: 0.2cm; background-color:rgb(255, 0, 0);color: rgb(255, 255, 255);"

        <p>
