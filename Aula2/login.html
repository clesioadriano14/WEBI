<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <div style="background-color: rgb(32, 182, 57);">
        <header style="color: rgb(253, 253, 253);">
            <br>
            <h1><img src="https://images.icon-icons.com/1760/PNG/512/4105941-lock-login-password-security-sign-in-sign-out_113932.png"
                    width="30"> Login</h1>
        </header>
        <hr>
    </div>
    <img src="https://www.ifmg.edu.br/portal/centrais-de-conteudos/publicacoes/informativo/183/183_arquivos/logo-1.png/@@images/5076e06e-d465-431a-b2cd-0b728c0227e3.png"
        alt="Foto de perfil" width="280px">
    <form>
        <table width="480">
            <tr>
                <td>
                    <label for="usuario">
                        <b>Usuário: </b>
                    </label>
                </td>
                <td>
                    <input style="padding: 2%;" type="text" id="usuario" name="usuario"
                        placeholder="Digite seu usuário:">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="senha">
                        <br><b>Senha:</b>
                    </label>
                </td>
                <td>
                    <br><input style="padding: 2%;" type="password" id="senha" name="senha" placeholder="*********">
                </td>
            </tr>
            <tr>
                <td></td>
                <td colspan="2">
                    <br><button
                        style="border: 4cap; padding: 2%; width: 5cm;background-color:rgb(255, 0, 0);color: rgb(255, 255, 255);"
                        type="submit"> Entrar
                    </button>
                </td>
            </tr>
            <tr>
                <td></td>
                <td colspan="2">
                    <a style="color: black;font-size: 89%;" href="cadastro1.html">Não tem conta?
                        Cadastre-se
                    </a>
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
