<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <h1>Login</h1>
    <img src="https://www.ifmg.edu.br/portal/centrais-de-conteudos/publicacoes/informativo/183/183_arquivos/logo-1.png/@@images/5076e06e-d465-431a-b2cd-0b728c0227e3.png"
        alt="Foto de perfil" width="280px">
    <form>
        <table>
            <tr>
                <td>
                    <label for="usuario">
                        <b>Usuário:</b>
                    </label>
                </td>
                <td>
                    <input type="text" 
                    id="usuario" 
                    name="usuario" 
                    placeholder= "Digite seu usuário:">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="senha">
                        <b>Senha:</b>
                    </label>
                </td>
                <td>
                    <input type="password" id="senha" name="senha" placeholder="*********">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button style="width: 6.1cm;" type="submit"> Entrar
                    </button>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <a style="color: black;" href="cadastro1.html">Não tem conta? Cadastre-se
                    </a>
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
