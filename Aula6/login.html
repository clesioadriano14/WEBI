<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body id="telaLogin">
        <div id="janela">
            <div id="centrocima">
                <br>
                <h1><img> Login</h1>
            </div>
            <form>
                
                <table>
                    <tr>
                        <td>
                            <label for="usuario">
                                <b>Usuário: </b>
                            </label>
                        </td>
                        <td>
                            <input style="padding: 2%;" type="text" id="usuario"
                                name="usuario"
                                placeholder="Digite seu usuário:">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="senha">
                                <br><b>Senha:</b>
                            </label>
                        </td>
                        <td>
                            <br><input style="padding: 2%;" type="password"
                                id="senha" name="senha" placeholder="*********">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td colspan="2">
                            <br><button
                                id="botaoEnviar"
                                type="submit"> Entrar
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td colspan="2">
                            <a style="color: black;font-size: 89%;"
                                href="cadastro1.html">Não tem conta?
                                Cadastre-se
                            </a>
                        </td>
                    </tr>
                </table>
            </form>

        </div>

    </body>

</html>
