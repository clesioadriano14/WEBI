<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body id="telaLogin">
        <div class="tela-imagem"></div>
        <div class="tela-conteudo">
            <form id="formLogin" method="post">
                <h1>LOGIN</h1>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario"
                    placeholder="@mail.com" autocomplete="username" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                    placeholder="senha" autocomplete="current-password"
                    required>

                <div class="opcoes-login">
                    <a href="#" class="link-secundario">Esqueceu a senha?</a>
                </div>

                <button id="botaoEnviar" type="submit">Entrar</button>

                <p class="cadastro-link">Não tem uma conta?
                    <a href="cadastro1.html" class="link-secundario">Inscreva-se</a>
                </p>

            </form>
        </div>
    </body>

</html>
